name: Deploy React App to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'react-app/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: react-app/package-lock.json

      - name: Install dependencies
        working-directory: react-app
        run: npm ci

      - name: Build
        working-directory: react-app
        run: npm run build

      - name: Copy custom domain + SPA fallback files
        run: |
          cp CNAME react-app/dist/CNAME
          touch react-app/dist/.nojekyll
          cp react-app/dist/index.html react-app/dist/404.html

      - name: Pre-render static routes (para que Google reciba 200 en vez de 404)
        working-directory: react-app/dist
        run: |
          for route in catalogo sillon-bkf proyectos nosotros faq contacto envios garantia; do
            mkdir -p "$route"
            cp index.html "$route/index.html"
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: react-app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
