name: Deploy React App to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'react-app/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Historial completo: el prerender calcula el <lastmod> del
          # sitemap con la fecha del último commit de cada página. Con el
          # clone superficial por defecto todas saldrían con la misma fecha.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: react-app/package-lock.json

      - name: Install dependencies
        working-directory: react-app
        run: npm ci

      - name: Build (client + SSR + prerender)
        working-directory: react-app
        # npm run build ahora encadena 3 pasos (ver package.json):
        #   1. vite build            → bundle del navegador en dist/
        #   2. vite build --ssr      → entry-server para Node en .ssr-build/
        #   3. node scripts/prerender.js → renderiza cada ruta a HTML real
        #      con su propio title/description/canonical/JSON-LD y escribe
        #      dist/<ruta>/index.html + dist/404.html
        run: npm run build

      - name: Copy custom domain + Jekyll bypass
        run: |
          cp CNAME react-app/dist/CNAME
          touch react-app/dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: react-app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Avisa a Bing, Yandex, Seznam y Naver (protocolo IndexNow) que el sitio
  # cambió, con todas las URLs del sitemap. Bing alimenta a Copilot y a la
  # búsqueda de ChatGPT. La clave es pública por diseño: el archivo
  # react-app/public/<clave>.txt prueba que el sitio es nuestro. Si falla,
  # no rompe el deploy (el sitio ya está publicado en el paso anterior).
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      HOST: tallerkappa.com.ar
      KEY: a4bee4f062d4041dde7097ffb1d1efc0
    steps:
      - name: Enviar URLs a IndexNow
        run: |
          # Margen para que GitHub Pages sirva la versión nueva.
          sleep 60
          urls=$(curl -fsS "https://$HOST/sitemap.xml?v=$GITHUB_RUN_ID" | grep -o '<loc>[^<]*</loc>' | sed -E 's#</?loc>##g' | jq -R . | jq -s .)
          echo "URLs: $(echo "$urls" | jq length)"
          body=$(jq -n --arg host "$HOST" --arg key "$KEY" --argjson urls "$urls" \
            '{host: $host, key: $key, keyLocation: ("https://" + $host + "/" + $key + ".txt"), urlList: $urls}')
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' -d "$body")
          echo "IndexNow respondió HTTP $code"
          [ "$code" = 200 ] || [ "$code" = 202 ]
