name: Deploy React App to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'react-app/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: react-app/package-lock.json

      - name: Install dependencies
        working-directory: react-app
        run: npm ci

      - name: Build (client + SSR + prerender)
        working-directory: react-app
        # npm run build ahora encadena 3 pasos (ver package.json):
        #   1. vite build            → bundle del navegador en dist/
        #   2. vite build --ssr      → entry-server para Node en .ssr-build/
        #   3. node scripts/prerender.js → renderiza cada ruta a HTML real
        #      con su propio title/description/canonical/JSON-LD y escribe
        #      dist/<ruta>/index.html + dist/404.html
        run: npm run build

      - name: Copy custom domain + Jekyll bypass
        run: |
          cp CNAME react-app/dist/CNAME
          touch react-app/dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: react-app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
