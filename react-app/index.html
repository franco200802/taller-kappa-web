<!DOCTYPE html>
<html lang="es-AR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#E8E9E6">
    <meta name="author" content="Taller Kappa S.R.L.">

    <!--
      title / description / canonical / Open Graph / Twitter los inyecta
      react-helmet-async por ruta, y el script de prerender los escribe
      ya resueltos en el HTML de cada página. No declararlos acá evita
      que el canonical del home termine duplicado en todas las rutas.
      Solo queda un title de arranque para el dev server.
    -->
    <title>Taller Kappa — Sillones BKF y Muebles de Hierro</title>

    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
    <link rel="icon" type="image/png" sizes="64x64" href="/images/favicon-64.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.json">

    <!-- Archivo autoalojada (ver @font-face en global.css): se precarga porque el
         h1 del hero (el LCP de la home) se pinta con ella. crossorigin es obligatorio
         para fuentes aunque sean del mismo origen. Los íconos son SVG en línea
         (components/Icon.jsx): ya no hay CSS ni fuentes de terceros que bloqueen el render. -->
    <link rel="preload" href="/fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
